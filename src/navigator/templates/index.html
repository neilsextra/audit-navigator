<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Audit Monitor</title>
    <link rel="icon" type="text/css" href="{{ url_for('static', filename='images/favicon.ico') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/main.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/tabview.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/slider.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/range.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/timeline.css') }}" />

    <style>
        textarea {
            resize: none;
        }
    </style>

    <script src="{{ url_for('static', filename='javascripts/util/message.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/util/stringutils.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/tabview.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/panelview.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/jsonview.js') }}"></script>

</head>

<script type="text/template" id="snapshot-version">
  <div class="container left" onclick="retrieve('${request}')">
    <div class="${class}" id="snapshot-${request}">
      <label style="font-weight:bold">${time}</label>
      <p style="font-size: 12px; font-family: 'Lucida Console', 'Courier New', monospace;"">${request}</p>
    </div>
  </div>
</script>

<body>
    <dialog id="wait-dialog" class="dialog"
        style="position:absolute; width:100%; height:100%; opacity: 0.5; border: none; overflow: hidden;">
        <div style="position:absolute; width:100%; height:100%; overflow: hidden;">
            <div id="wait-spinner" style="position:absolute; left: 50%; top: 45%; opacity: 1.0;">
                <div style="width:48px; height:48px; z-index: 10; opacity: 1.0;" class="waiting">
                    <img src="{{ url_for('static', filename='images/wait.svg') }}" width="48" height="48" />
                </div>
            </div>
        </div>
    </dialog>

    <dialog id="error-dialog" class="dialog message-dialog" style="min-width:400px;">
        <img src="{{url_for( 'static', filename='images/exclamation.svg')}}" width="48" height="48"
            style="float: left; margin-right:10px;" />
        <p id="error-message" style="font-size: 18px; font-weight: bold;">/p>
        <form method="dialog">
            <button class="message-dialog-small-button" style="float: right;">OK</button>
        </form>
    </dialog>

    <dialog id="connect-dialog" class="dialog" style="min-width:700px; height:550px; overflow:none">
        <div
            style="position:absolute; top:0px; left:5px; right:5px; height: 60px; border-bottom:2px groove rgba(0,0,0, 0.2)">
            <p style="position:absolute; height:50px; font-size: 24px; font-weight: bold; left:10px;">
                Connection Settings...</p>
        </div>
        <div style="position:absolute; top:70px; left:0px; right:0px; overflow:none">
            <img src="{{url_for( 'static', filename='images/exclamation.svg')}}" width="128" height="128"
                style="float: left; margin-right:10px;" />
        </div>

        <div id="connection-tabs"
            style="position:absolute; top:80px; left:100px; right:10px; overflow:none; padding-left:20px; margin-right:20px;">

            <div class="tab">
                <button class="tablinks" id="connection-tab1"
                    onclick="showTab(event, 'connection-tabs', 'datalake-panel', 'connection-tab1')"
                    value="datalake">Datalake</button>
            </div>

            <div id="datalake-panel" class="tabcontent"
                style="position:absolute; top:45px; overflow:none; padding-left:20px; left:20px; right:0px; border: 1px solid rgba(0, 0, 0, 0.2); display:inline-block;">
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">
                    URL
                </p>
                <input class="modal-entry" id="datalake-url" style="position:relative; width:480px;" type="text"
                    name="datalake-url" placeholder="https://&lt;server&gt;" required>
                </input>
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">Namespace
                </p>
                <input class="modal-entry" id="datalake-namespace" style="position:relative; width:480px;" type="text"
                    name="datalake-namespace" placeholder="namespace" required>
                </input>
                <p style=" position:relative; font-size: 14px; font-weight: bold;">User Id
                </p>
                <input class="modal-entry" id="datalake-userid" style="position:relative; width:480px;" type="text"
                    name="datalake-userid" placeholder="userid" required>
                </input>
                <p style="position:relative; font-size: 14px; font-weight: bold;">Password
                </p>
                <input class="modal-entry" id="datalake-password" style="position:relative; width:480px;"
                    type="password" name="datalake-password" placeholder="password" required></input>
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">Base Table
                </p>
                <input class="modal-entry" id="datalake-table"
                    style="position:relative; width:480px; margin-bottom:60px;" type="text" name="base-table"
                    placeholder="base table" required>
                </input>

            </div>

        </div>

        <div style="position:absolute; bottom:10px; left:10px; right:10px;">
            <button id="cancel-connect-dialog" class="close-button message-dialog-small-cancel-button"
                style="float: right; margin-top:10px; margin-right:10px; width:80px;" disabled>Cancel</button>

            <button id="ok-connect-dialog" class="message-dialog-small-button navigator-action"
                style="float: right; margin-top:10px; margin-right:10px; width:80px;" disabled>Connect</button>
        </div>

    </dialog>

    <dialog id="info-dialog" class="dialog" style="min-width:980px; height:660px;">
        <div>
            <p id="profile-header" style="font-size: 18px; font-weight: bold;">About...</p>
            <div id="info-tabs"
                style="position:absolute; top:74px; left:10px; right:10px; bottom:40px; overflow:hidden; border-bottom:2px groove rgba(0,0,0, 0.2)">
                <div class="tab">
                    <button class="tablinks" id="info-tab1"
                        onclick="showTab(event, 'info-tabs', 'summary-panel', 'info-tab1')"
                        value="Token">Summary</button>
                    <button class="tablinks" id="info-tab2"
                        onclick="showTab(event, 'info-tabs', 'indexes-panel', 'info-tab2')"
                        value="URLs">Indexes</button>
                    <button class="tablinks" id="info-tab3"
                        onclick="showTab(event, 'info-tabs', 'checkpoint-panel', 'info-tab3')"
                        value="checkpoint">Checkpoint</button>
                </div>

                <div id="summary-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;">
                    <div id="token-view"
                        style="position:absolute; left:0px; top:2px; right:0px; bottom:0px; overflow-y: auto;">
                    </div>
                </div>

                <div id="indexes-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;">
                    <div id="indexes-view"
                        style="position:absolute; left:0px; top:2px; right:0px; bottom:0px; overflow-y: auto;">
                    </div>
                </div>

                <div id="checkpoint-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;">
                    <div id="checkpoint-view"
                        style="position:absolute; left:0px; top:2px; right:0px; bottom:0px; overflow-y: auto;">
                    </div>
                </div>

            </div>

            <div style="position:absolute; bottom:10px; left:10px; right:10px;">
                <button id="close-info-dialog" class="close-button message-dialog-small-cancel-button"
                    style="float:right; margin-top:10px; width:64px;">Close</button>
            </div>
        </div>
    </dialog>

    <div style="position:absolute; left:0px; right:0px; top:0px; height:30px; -webkit-app-region: drag;">
        <div class="header" style="position:absolute; top:-5px; left:10px; right:10px;">
            <p>Audit&nbsp;Navigator</p>
            <div class="toolbar" style="position:absolute; top:15px; left:10px; right:0px;">

                <button id="connect-button" class="message-dialog-small-button navigator-action"
                    style="float:right; height:24px; width:40px; margin-right:10px" disabled>
                    <img src="{{ url_for('static', filename='images/connect.svg') }}" width="18" height="18"></img>
                </button>
                <button id="info-button" class="message-dialog-small-button navigator-action"
                    style="float:right; height:24px; width:40px; margin-right:10px" disabled>
                    <img src="{{ url_for('static', filename='images/info.svg') }}" width="18" height="18"></img>
                </button>
            </div>
        </div>
    </div>

    <div id="action-tabs" style="position:absolute; top:44px; left:10px; width:376px; bottom:10px; overflow:hidden;">
        <div class="tab">
            <button class="tablinks" id="action-tab1"
                onclick="showTab(event, 'action-tabs', 'search-panel', 'action-tab1')" value="Search">Search</button>
            <button class="tablinks" id="action-tab2"
                onclick="showTab(event, 'action-tabs', 'bookmarks-panel', 'action-tab2')"
                value="Bookmarks">Bookmarks</button>
            <button class="tablinks" id="action-tab3"
                onclick="showTab(event, 'action-tabs', 'history-panel', 'action-tab3')" value="History">History</button>
        </div>

        <div id="search-panel" class="tabcontent"
            style="display:inline-block; position: absolute; top: 45px; bottom: 20px; width:350px; left: 0px; overflow:none">

            <select name="search-index" id="search-index"
                style="position:absolute; top:6px; left:10px; height:24px; font-size:12px; width:105px;">
                <option value=""></option>
            </select>

            <input id="search-argument" class="search"
                style="position:absolute; top:6px; height:24px; left:120px; right:52px; height:18px;"
                name="search-argument">
            </input>

            <button id="search-button" class="message-dialog-small-button"
                style="float: right; height:24px; margin-top:0px; margin-right:0px;">
                <img src="{{ url_for('static', filename='images/search.svg') }}" width="18" , height="18"></img>
            </button>

            <div id="search-results"
                style="position:absolute; top:36px; left:10px; right:10px; bottom:60px; border: 1px solid rgba(0,0,0, 0.2); padding:4px; overflow:auto;">
                <table id="search-table" class="result-table"></table>
            </div>
            <div style="position:absolute; left:10px; right:10px; bottom:50px;">
                <label for="search-limit" style="position:absolute; top:2px; font-weight:bold;"
                    class="field">Limit:</label>
                <input type="range" id="search-limit" name="limit" min="50" max="500" value="50" step="50"
                    list="search-tickmarks" style="position:absolute; top:-2px; width:280px; left:40px;"></input>

                <div class="current-value" style="position:absolute; top:4px; left:340px;">
                    <span id="search-limit-value">50</span>
                </div>

                <datalist id="search-tickmarks">
                    <option value="50"></option>
                    <option value="100"></option>
                    <option value="150"></option>
                    <option value="200"></option>
                    <option value="250"></option>
                    <option value="300"></option>
                    <option value="350"></option>
                    <option value="400"></option>
                    <option value="450"></option>
                    <option value="500"></option>
                </datalist>

                <div class="search-slider-labels"
                    style="display:block; position:absolute; top:18px; width:390px; left:40px;">
                    <span class="slider-tick-label">&nbsp;50</span>
                    <span class="slider-tick-label">100</span>
                    <span class="slider-tick-label">150</span>
                    <span class="slider-tick-label">200</span>
                    <span class="slider-tick-label">250</span>
                    <span class="slider-tick-label">300</span>
                    <span class="slider-tick-label">350</span>
                    <span class="slider-tick-label">400</span>
                    <span class="slider-tick-label">450</span>
                    <span class="slider-tick-label">500</span>
                </div>

            </div>

        </div>

        <div id="bookmarks-panel" class="tabcontent"
            style="position: absolute; top: 45px; bottom: 20px; width:350px; left: 0px; overflow:hidden;">
            <input id="filter-bookmarks" class="search" style="position:absolute; height:18px; left:10px; right:50px"
                name="filter-bookmarks">
            </input>

            <button id="filter-bookmarks-button" class="message-dialog-small-button"
                style="float: right; height:24px; margin-left:5px;">
                <img src="{{ url_for('static', filename='images/filter.svg') }}" width="18" , height="18"></img>
            </button>

            <div id="bookmarks-results"
                style="position:absolute; top:36px; left:10px; right:10px; bottom:40px; border: 1px solid rgba(0,0,0, 0.2);  padding:4px; overflow:auto;">
                <table id="bookmarks-table" class="result-table"></table>
            </div>

            <div id="bookmark-controls"
                style="position:absolute; height: 30px; left:10px; right:10px; bottom:0px; padding:4px; overflow:none;">
                <button id="clear-bookmarks-button" class="message-dialog-small-button"
                    style="position:absolute; right:0px;">
                    <img src="{{ url_for('static', filename='images/brush.svg') }}" width="18" , height="18"></img>
                </button>
            </div>
        </div>

        <div id="history-panel" class="tabcontent"
            style="position: absolute; top: 45px; bottom: 20px; width:350px; left: 0px; overflow:hidden;">
            <input id="filter-history" class="search" style="position:absolute; height:18px; left:10px; right:50px"
                name="filter-history">
            </input>

            <button id="filter-history-button" class="message-dialog-small-button"
                style="float: right; height:24px; margin-left:5px;">
                <img src="{{ url_for('static', filename='images/filter.svg') }}" width="18" , height="18"></img>
            </button>

            <div id="history-results"
                style="position:absolute; top:36px; left:10px; right:10px; bottom:40px; border: 1px solid rgba(0,0,0, 0.2);  padding:4px; overflow:auto;">
                <table id="history-table" class="result-table"></table>
            </div>

            <div id="history-controls"
                style="position:absolute; height: 30px; left:10px; right:10px; bottom:0px; padding:4px; overflow:none;">
                <button id="clear-history-button" class="message-dialog-small-button"
                    style="position:absolute; right:0px;">
                    <img src="{{ url_for('static', filename='images/brush.svg') }}" width="18" , height="18"></img>
                </button>
            </div>
        </div>
    </div>

    <div id="display-panel"
        style="display:inline-block; position: absolute; top: 44px; bottom: 30px; left: 395px; right: 10px; border: 1px solid rgba(0, 0, 0, 0.2);">
        <div id="request-view" style="visibility:hidden">
            <div id="request-tabs"
                style="position:absolute; top:10px; left:10px; right:348px; bottom:40px; overflow:hidden;">
                <div class="tab">
                    <button class="tablinks" id="request-tab1"
                        onclick="showTab(event, 'request-tabs', 'request-summary-panel', 'request-tab1')"
                        value="Summary">Summary</button>
                    <button class="tablinks" id="request-tab2"
                        onclick="showTab(event, 'request-tabs', 'request-history-panel', 'request-tab2')"
                        value="History">History</button>
                </div>

                <div id="request-summary-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px; overflow: auto;">
                    <div id="json:summary" style="position:absolute; left:0px; top:2px; right:0px; bottom:0px;">
                    </div>
                </div>

                <div id="request-history-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;  overflow: auto;">
                    <div id="json:history" style="position:absolute; left:0px; top:2px; right:0px; bottom:0px;">
                    </div>
                </div>

            </div>
            <div id="bookmark-controls"
                style="position:absolute; height: 30px; right:10px; bottom:0px; padding:4px; overflow:none;">
                <button id="bookmark-button" class="message-dialog-small-button" style="position:absolute; right:36px;">
                    <img src="{{ url_for('static', filename='images/bookmark-check.svg') }}" width="18" ,
                        height="18"></img>
                </button>
                <button id="unbookmark-button" class="message-dialog-small-button"
                    style="position:absolute; right:0px;">
                    <img src="{{ url_for('static', filename='images/bookmark-uncheck.svg') }}" width="18" ,
                        height="18"></img>
                </button>
            </div>

            <div id="request-history"
                style="position:absolute; top:10px; width:326px; right:10px; bottom:40px; overflow:hidden; border: 1px solid rgba(0, 0, 0, 0.2);">
                <div id="request-timeline-view"
                    style="position:absolute; top:10px; left:10px; right:10px; bottom:70px; overflow-x:hidden; overflow-y: auto;">
                    <div id="request-timeline" class="timeline"
                        style="position:absolute; top:0px; left:0px; right:0px; bottom:0px;">
                    </div>
                </div>

                <div
                    style="position:absolute; left:10px; right:10px; bottom:60px; height:2px; border-top: 1px solid rgba(0, 0, 0, 0.2);">
                </div>

                <div id="request-timeline-toolbar"
                    style="position:absolute; left:0px; right:0px; bottom:0px; height:50px;">
                    <label for="snapshots-offset" style="position:absolute; left:10px; top:2px; font-weight:bold;"
                        class="field">Range:</label>

                    <input type="number" id="snapshots-offset" name="offset" min="0"
                        style="position:absolute; top:2px; width:45px; left:55px;" value="0"></input>

                    <input type="range" id="snapshots-length" name="snapshots-limit" min="10" max="100" value="50" step="10"
                        list="snapshots-length-tickmarks" style="position:absolute; top:-2px; width:180px; left:110px;"></input>

                    <datalist id="snapshots-length-tickmarks">
                        <option value="10"></option>
                        <option value="20"></option>
                        <option value="30"></option>
                        <option value="40"></option>
                        <option value="50"></option>
                        <option value="60"></option>
                        <option value="70"></option>
                        <option value="80"></option>
                        <option value="90"></option>
                        <option value="100"></option>
                    </datalist>

                    <div class="range-slider-labels"
                        style="display:block; position:absolute; top:18px; width:200px; left:110px; ">
                        <span class="range-tick-label">&nbsp;10</span>
                        <span class="range-tick-label">20</span>
                        <span class="range-tick-label">30</span>
                        <span class="range-tick-label">40</span>
                        <span class="range-tick-label">50</span>
                        <span class="range-tick-label">60</span>
                        <span class="range-tick-label">70</span>
                        <span class="range-tick-label">80</span>
                        <span class="range-tick-label">90</span>
                        <span class="range-tick-label">100</span>
                    </div>

                    <button id="snapshots-button" class="undecorated-small-button"
                        style="position:absolute; right:10px; top:-1px;">
                        <img src="{{ url_for('static', filename='images/caret-right.svg') }}" width="18" , height="18"
                            style="margin-top:2px;"></img>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div id="status" class="status-message" style="position:absolute; bottom:6px; left:6px;">
    </div>
</body>

<script src="{{ url_for('static', filename='javascripts/main.js') }}"></script>

</html>
