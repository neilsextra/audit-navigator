<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Audit Monitor</title>
    <link rel="icon" type="text/css" href="{{ url_for('static', filename='images/favicon.ico') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/main.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/tabview.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/panelview.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/slider.css') }}" />

    <style>
        textarea {
            resize: none;
        }
    </style>

    <script src="{{ url_for('static', filename='javascripts/util/message.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/tabview.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/panelview.js') }}"></script>
    <script src="{{ url_for('static', filename='javascripts/gui/jsonview.js') }}"></script>

</head>

<body>
    <dialog id="wait-dialog" class="dialog"
        style="position:absolute; width:100%; height:100%; opacity: 0.5; border: none; overflow: hidden;">
        <div style="position:absolute; width:100%; height:100%; overflow: hidden;">
            <div id="wait-spinner" style="position:absolute; left: 50%; top: 45%; opacity: 1.0;">
                <div style="width:48px; height:48px; z-index: 10; opacity: 1.0;" class="waiting">
                    <img src="{{ url_for('static', filename='images/wait.svg') }}" width="48" height="48" />
                </div>
            </div>
        </div>
    </dialog>

    <dialog id="error-dialog" class="dialog message-dialog" style="min-width:400px;">
        <img src="{{url_for( 'static', filename='images/exclamation.svg')}}" width="48" height="48"
            style="float: left; margin-right:10px;" />
        <p id="error-message" style="font-size: 18px; font-weight: bold;">/p>
        <form method="dialog">
            <button class="message-dialog-small-button" style="float: right;">OK</button>
        </form>
    </dialog>

    <dialog id="connect-dialog" class="dialog" style="min-width:700px; height:550px; overflow:none">
        <div
            style="position:absolute; top:0px; left:5px; right:5px; height: 60px; border-bottom:2px groove rgba(0,0,0, 0.2)">
            <p style="position:absolute; height:50px; font-size: 24px; font-weight: bold; left:10px;">
                Connection Settings...</p>
        </div>
        <div style="position:absolute; top:70px; left:0px; right:0px; overflow:none">
            <img src="{{url_for( 'static', filename='images/exclamation.svg')}}" width="128" height="128"
                style="float: left; margin-right:10px;" />
        </div>

        <div id="connection-tabs"
            style="position:absolute; top:80px; left:100px; right:10px; overflow:none; padding-left:20px; margin-right:20px;">

            <div class="tab">
                <button class="tablinks" id="connection-tab1"
                    onclick="showTab(event, 'connection-tabs', 'datalake-panel', 'connection-tab1')"
                    value="datalake">Datalake</button>
             </div>

            <div id="datalake-panel" class="tabcontent"
                style="position:absolute; top:45px; overflow:none; padding-left:20px; left:20px; right:-2px; border: 1px solid rgba(0, 0, 0, 0.2); display:inline-block;">
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">
                    URL
                </p>
                <input class="modal-entry" id="datalake-url" style="position:relative; width:480px;" type="text"
                    name="datalake-url" placeholder="https://&lt;server&gt;" required>
                </input>
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">Namespace
                </p>
                <input class="modal-entry" id="datalake-namespace" style="position:relative; width:480px;" type="text"
                    name="datalake-namespace" placeholder="namespace" required>
                </input>
                <p style=" position:relative; font-size: 14px; font-weight: bold;">User Id
                </p>
                <input class="modal-entry" id="datalake-userid" style="position:relative; width:480px;" type="text"
                    name="datalake-userid" placeholder="userid" required>
                </input>
                <p style="position:relative; font-size: 14px; font-weight: bold;">Password
                </p>
                <input class="modal-entry" id="datalake-password"
                    style="position:relative; width:480px;" type="password" name="datalake-password"
                    placeholder="password" required></input>
                <p style=" position:relative;  font-size: 14px; font-weight: bold;">Base Table
                </p>
                <input class="modal-entry" id="datalake-table" style="position:relative; width:480px; margin-bottom:60px;" type="text"
                    name="base-table" placeholder="base table" required>
                </input>
 
            </div>

        </div>

        <div style="position:absolute; bottom:10px; left:10px; right:10px;">
            <button id="cancel-connect-dialog" class="close-button message-dialog-small-cancel-button server-action"
                style="float: right; margin-top:10px; margin-right:10px; width:80px;" disabled>Cancel</button>

            <button id="ok-connect-dialog" class="message-dialog-small-button server-command"
                style="float: right; margin-top:10px; margin-right:10px; width:80px;" disabled>Connect</button>
        </div>

    </dialog>

    <dialog id="info-dialog" class="dialog" style="min-width:980px; height:660px;">
        <div>
            <p id="profile-header" style="font-size: 18px; font-weight: bold;">About...</p>
            <div id="info-tabs"
                style="position:absolute; top:74px; left:10px; right:10px; bottom:40px; overflow:hidden;">
                <div class="tab">
                    <button class="tablinks" id="info-tab1"
                        onclick="showTab(event, 'info-tabs', 'summary-panel', 'info-tab1')"
                        value="Token">Summary</button>
                    <button class="tablinks" id="info-tab2"
                        onclick="showTab(event, 'info-tabs', 'checkpoint-panel', 'info-tab2')"
                        value="URLs">Checkpoint</button>
                </div>

                <div id="summary-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;">
                    <div id="token-view"
                        style="position:absolute; left:0px; top:2px; right:0px; bottom:0px; overflow-y: auto;">


                    </div>
                </div>

                <div id="checkpoint-panel" class="tabcontent"
                    style="position:absolute; top:45px; left:0px; right:0px; bottom:0px;">
                    <div id="checkpoint-view"
                        style="position:absolute; left:0px; top:2px; right:0px; bottom:0px; overflow-y: auto;">
                    </div>
                </div>

            </div>

            <div style="position:absolute; bottom:10px; left:10px; right:10px;">
                <button id="close-info-dialog" class="close-button message-dialog-small-cancel-button"
                    style="float:right; margin-top:10px; width:64px;">Close</button>
            </div>
        </div>
    </dialog>

    <div style="position:absolute; left:0px; right:0px; top:0px; height:30px; -webkit-app-region: drag;">
        <div class="header" style="position:absolute; top:-5px; left:10px; right:10px;">
            <p>Audit&nbsp;Navigator</p>
            <div class="toolbar" style="position:absolute; top:15px; left:10px; right:0px;">

                <button id="connect-button" class="message-dialog-small-button server-action"
                    style="float:right; height:24px; width:40px; margin-right:10px" disabled>
                    <img src="{{ url_for('static', filename='images/connect.svg') }}" width="18" height="18"></img>
                </button>
                <button id="info-button" class="message-dialog-small-button server-action"
                    style="float:right; height:24px; width:40px; margin-right:10px" disabled>
                    <img src="{{ url_for('static', filename='images/info.svg') }}" width="18" height="18"></img>
                </button>
            </div>
        </div>
    </div>

    <div id="search-panel"
        style="display:inline-block; position: absolute; top: 44px; bottom: 30px; width:440px; left: 10px; border: 1px solid rgba(0, 0, 0, 0.2); overflow:none">

        <input id="search-argument" class="search"
            style="position:absolute; top:6px; height:24px; left:10px; right:62px; height:18px;" name="search-argument">
        </input>
        <button id="search-button" class="message-dialog-small-button"
            style="float: right; height:24px; margin-top:6px; margin-right:5px;">Search</button>
        <div id="search-results"
            style="position:absolute; top:36px; left:10px; right:10px; bottom:60px; border: 1px solid rgba(0,0,0, 0.2); padding:4px; overflow:auto;">
            <table id="search-table" class="result-table"></table>
        </div>
        <div style="position:absolute; left:10px; right:10px; bottom:50px;">
            <label for="search-limit" style="position:absolute; top:2px; font-weight:bold;" class="field">Limit:</label>
            <input type="range" id="search-limit" name="limit" min="50" max="500" value="50" step="50"
                list="search-tickmarks" style="position:absolute; top:-2px; width:340px; left:40px;"></input>

            <div class="current-value" style="position:absolute; top:4px;left:384px;">
                <span id="search-limit-value">50</span>
            </div>

            <datalist id="search-tickmarks">
                <option value="50"></option>
                <option value="100"></option>
                <option value="150"></option>
                <option value="200"></option>
                <option value="250"></option>
                <option value="300"></option>
                <option value="350"></option>
                <option value="400"></option>
                <option value="450"></option>
                <option value="500"></option>
            </datalist>

            <div class="search-slider-labels"
                style="display:block; position:absolute; top:18px; width:500px; left:40px;">
                <span class="slider-tick-label">&nbsp;50</span>
                <span class="slider-tick-label">&nbsp;100</span>
                <span class="slider-tick-label">&nbsp;150</span>
                <span class="slider-tick-label">&nbsp;200</span>
                <span class="slider-tick-label">&nbsp;250</span>
                <span class="slider-tick-label">&nbsp;300</span>
                <span class="slider-tick-label">&nbsp;350</span>
                <span class="slider-tick-label">&nbsp;400</span>
                <span class="slider-tick-label">&nbsp;450</span>
                <span class="slider-tick-label">&nbsp;500</span>
            </div>

        </div>

    </div>

    <div id="display-panel"
        style="display:inline-block; position: absolute; top: 44px; bottom: 30px; left: 460px; right: 10px; border: 1px solid rgba(0, 0, 0, 0.2);">

    </div>

    <div id="status" class="status-message" style="position:absolute; bottom:6px; left:6px;">
    </div>
</body>

<script src="{{ url_for('static', filename='javascripts/main.js') }}"></script>

</html>
